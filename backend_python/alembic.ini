[alembic]
script_location = backend_python/migrations
prepend_sys_path = .

sqlalchemy.url = driver

[loggers]
keys = root,sqlalchemy,alembic
level = INFO
handlers = console
qualname = 

[handlers]
keys = console
handlers = console
class = StreamHandler
args = (sys.stderr,)

[formatters]
keys = generic
formatters = generic
class = %(class)s
format = %(levelname)-5.5s [%(name)s] %(message)s

[alembic:env]
# env.py is responsible for setting sqlalchemy.url from DATABASE_URL

